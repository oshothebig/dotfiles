# Tools required by this repository's own tasks (`just install`, `just format`).
# Shared by the Cloud Agent bootstrap (.cursor/install.sh) and the Format check
# workflow (.github/workflows/format.yaml).
[tools]
just = "1.50.0"
yamlfmt = "0.21.0"

# Unlike Stow packages, sources here don't mirror the home directory layout.
[dotfiles]
"~/.config/bat/config" = "bat/config"
"~/.config/bat/themes/tokyonight_day.tmTheme" = "bat/themes/tokyonight_day.tmTheme"
"~/.config/bat/themes/tokyonight_moon.tmTheme" = "bat/themes/tokyonight_moon.tmTheme"
"~/.config/bat/themes/tokyonight_night.tmTheme" = "bat/themes/tokyonight_night.tmTheme"
"~/.config/bat/themes/tokyonight_storm.tmTheme" = "bat/themes/tokyonight_storm.tmTheme"
"~/.config/ghostty/config.ghostty" = "ghostty/config.ghostty"
"~/.config/helix/config.toml" = "helix/config.toml"
"~/.config/helix/languages.toml" = "helix/languages.toml"
"~/.config/sheldon/plugins.toml" = "sheldon/plugins.toml"
"~/.config/yamlfmt/yamlfmt.yaml" = "yamlfmt/yamlfmt.yaml"
