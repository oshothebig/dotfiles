[tools]
python = "3.14.5"
kubectl = "1.36.5"
kind = "latest"
helm = "latest"
kustomize = "latest"
k9s = "latest"
stern = "latest"
kubeseal = "latest"
argo = "latest"
flux2 = "latest"
crane = "latest"
node = "24.15.0"
go = "latest"
worktrunk = "latest"
zig = "latest"
bun = "latest"
uv = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
cilium-cli = "latest"
cilium-hubble = "latest"
cue = "latest"
delta = "latest"
gh = "latest"
opencode = "latest"
ghq = "latest"
jj = "latest"
lazygit = "latest"
terraform = "latest"
ruff = "latest"
azure-cli = "latest"
bat = "latest"
difftastic = "latest"
eza = "latest"
fastfetch = "latest"
fd = "latest"
fzf = "latest"
helix = "latest"
herdr = "latest"
hyperfine = "latest"
jq = "latest"
just = "latest"
ripgrep = "latest"
sd = "latest"
shellcheck = "latest"
sheldon = "latest"
starship = "latest"
tokei = "latest"
yamlfmt = "latest"
yq = "latest"
zola = "latest"
zellij = "latest"
