name: Format check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/casey/just:1.50.0
    steps:
      - uses: actions/checkout@v4

      - name: Run just format
        run: just format

      - name: Check for diff
        run: |
          if ! git diff --exit-code; then
            echo "justfile is not formatted. Run 'just format' locally."
            exit 1
          fi
