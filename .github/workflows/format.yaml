name: Format check

on:
  push:
    branches:
    - main
  pull_request:

env:
  JUST_VERSION: "1.50.0"
  YAMLFMT_VERSION: "0.21.0"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install just
      run: |
        curl -sSL https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz \
          | tar -xz -C /usr/local/bin just

    - name: Install yamlfmt
      run: |
        curl -sSL https://github.com/google/yamlfmt/releases/download/v${YAMLFMT_VERSION}/yamlfmt_${YAMLFMT_VERSION}_Linux_x86_64.tar.gz \
          | tar -xz -C /usr/local/bin yamlfmt

    - name: Run just format
      run: just format

    - name: Check for diff
      run: git diff --exit-code
