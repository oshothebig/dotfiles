name: Format check

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install just and yamlfmt
      uses: jdx/mise-action@v5.2.7

    - name: Run just format
      run: just format

    - name: Check for diff
      run: git diff --exit-code
