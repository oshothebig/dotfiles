name: Zsh completion tests

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  completions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install zsh
      run: sudo apt-get update && sudo apt-get install -y zsh

    - name: Check zsh syntax and completion cache
      run: zsh -n zsh/zshrc && zsh -n zsh/test-completions.zsh && zsh -f zsh/test-completions.zsh
